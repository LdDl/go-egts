name: egts-gateway

services:
  egts_gateway:
    image: ${EGTS_GATEWAY_IMAGE:-egts_gateway:local}
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    command: ["-conf", "/app/egts_gateway.toml"]
    ports:
      - "${EGTS_GATEWAY_BIND_HOST:-127.0.0.1}:${EGTS_GATEWAY_PORT:-8081}:8081"
    volumes:
      - type: bind
        source: ${EGTS_GATEWAY_CONFIG:-../egts_gateway.toml}
        target: /app/egts_gateway.toml
        read_only: true
        bind:
          create_host_path: false
      - gateway_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gateway_data:
